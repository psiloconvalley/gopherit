{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<!-- Call our diagnostic-enabled head.html partial -->
{{template "head" .}}
<body>
    <!-- Skip to content for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Render navigation partial -->
    {{template "nav" .}}

    <!-- Main Content Area -->
    <main id="main-content" role="main">
        {{template "content" .}}
    </main>

    <!-- Render footer partial with SVG inline icons -->
    {{template "footer" .}}
</body>
</html>
{{end}}
