{{define "footer"}}
<footer class="site-footer">
    <div class="footer-inner">
        <!-- Copyright & Domain: Line 1 (Mobile) / Left (Desktop) -->
        <div class="footer-group footer-copyright">
            &copy; 2026 gopherit.dev
        </div>

        <!-- Centered Go Brand: Line 2 (Mobile) / Center (Desktop) -->
        <div class="footer-group footer-powered">
            <div class="footer-note-container">
                <span class="footer-note-text">Powered by</span>
                <span class="footer-go-svg" aria-label="Go Programming Language">
                    {{template "icon-go" .}}
                </span>
            </div>
        </div>

        <!-- Release Info & Code Link: Line 3 (Mobile) / Right (Desktop) -->
        <div class="footer-group footer-source">
            <span class="footer-version">v1.0.0</span>
            <span class="footer-separator" aria-hidden="true">•</span>
            <a href="https://github.com/yourusername/gopherit" target="_blank" rel="noopener noreferrer" class="footer-link">
                Source
                <span class="footer-icon">
                    {{template "icon-external" .}}
                </span>
            </a>
        </div>
    </div>
</footer>
{{end}}
